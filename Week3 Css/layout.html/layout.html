<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    .grid-wrap div {
      border-radius: 10px;
      background-color: greenyellow;
    }
    .grid-wrap {
      display: grid;
      grid-gap: 5px;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      grid-template-rows: 50px 50px;
      /* text-align: center; */
      text-align: end;
      justify-content: center;
    }
    .flex-wrap div {
      border-radius: 10px;
      background-color: rgb(81, 88, 70);
      flex: 1;
      flex-wrap: nowrap;
    }
    .flex-wrap {
      display: flex;
      flex-wrap: wrap;
      flex-direction: row;
      margin: 30px 30px;
      padding: 30px 20px;
      width: 50px;
      height: 80px;

      /* grid-gap: 5px; */
      /* text-align: center; */
      /* text-align: end; */
      /* justify-content: center; */
    }
  </style>
  <body>
    <div class="grid-wrap">
      <div class="item1">One</div>
      <div class="item1">Two</div>
      <div class="item1">Three</div>
      <div class="item1">Four</div>
    </div>
    <div class="flex-wrap">
      <div class="item1">One</div>
      <div class="item1">Two</div>
      <div class="item1">Three</div>
      <div class="item1">Four</div>
    </div>
  </body>
</html>
